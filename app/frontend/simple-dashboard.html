<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brent Oil Price Analysis Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1480px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,0.35); overflow: hidden; }
        header { background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 35px; text-align: center; }
        h1 { font-size: 2.8em; margin-bottom: 8px; }
        .subtitle { font-size: 1.15em; opacity: 0.95; }

        .controls { padding: 25px; background: #f8fafc; display: flex; gap: 20px; flex-wrap: wrap; align-items: end; }
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; padding: 25px; background: #f8fafc; }
        .stat { background: white; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .stat-value { font-size: 2.4em; font-weight: 800; color: #1e3a8a; }

        .main { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; padding: 25px; }
        .chart-box { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .chart-container { height: 520px; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .events-box, .analysis-box { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .events-list { max-height: 380px; overflow-y: auto; }
        .event-item { padding: 16px; margin-bottom: 12px; background: #f8fafc; border-left: 5px solid #3b82f6; border-radius: 10px; }

        .advanced-analysis { background: #f0f9ff; border-radius: 16px; padding: 20px; }
        .advanced-analysis h3 { color: #1e3a8a; margin-bottom: 15px; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏭 Brent Oil Price Analysis</h1>
            <p class="subtitle">Bayesian Change Point Detection & Event Correlation (2011-2022)</p>
        </header>

        <div class="controls">
            <div class="control-group"><label>Start Date</label><input type="date" id="startDate" value="2011-02-20"></div>
            <div class="control-group"><label>End Date</label><input type="date" id="endDate" value="2022-12-31"></div>
            <div class="control-group"><label>Event Category</label>
                <select id="eventCategory">
                    <option value="all">All Categories</option>
                    <option value="Geopolitical">Geopolitical</option>
                    <option value="OPEC">OPEC</option>
                    <option value="Economic">Economic</option>
                    <option value="Conflict">Conflict</option>
                </select>
            </div>
            <button onclick="loadData()">📊 Load Analysis</button>
            <button onclick="runChangePointDetection()">🔍 Detect Change Points</button>
        </div>

        <div class="stat-cards">
            <div class="stat"><div class="stat-label">Data Points</div><div class="stat-value" id="dataPoints">0</div></div>
            <div class="stat"><div class="stat-label">Events</div><div class="stat-value" id="eventCount">0</div></div>
            <div class="stat"><div class="stat-label">Avg Price</div><div class="stat-value" id="avgPrice">$0.00</div></div>
            <div class="stat"><div class="stat-label">Volatility (Ann.)</div><div class="stat-value" id="volatility">0.00%</div></div>
        </div>

        <div class="main">
            <div class="chart-box">
                <div class="chart-title">Brent Crude Oil Prices with Event Markers</div>
                <div id="priceChart" class="chart-container"></div>
            </div>

            <div class="sidebar">
                <div class="events-box">
                    <div class="chart-title">Key Events Timeline</div>
                    <div id="eventsList" class="events-list"></div>
                </div>

                <!-- New Advanced Analysis Panel -->
                <div class="analysis-box advanced-analysis">
                    <h3>📊 Statistical Analysis & Forecast</h3>
                    <div id="advancedStats"></div>
                    <div id="forecastChart" style="height:260px; margin-top:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000/api';
        let priceData = [], allEvents = [];

        async function loadData() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            const pRes = await fetch(`${API_BASE}/prices?start_date=${start}&end_date=${end}`);
            const pData = await pRes.json();
            priceData = pData.data || [];

            const eRes = await fetch(`${API_BASE}/events`);
            const eData = await eRes.json();
            allEvents = eData.events || [];

            updateStats();
            renderChart();
            renderEventsList();
            renderAdvancedAnalysis();
        }

        function updateStats() {
            document.getElementById('dataPoints').textContent = priceData.length;
            const prices = priceData.map(d => d.price || 0).filter(p => p > 0);
            if (prices.length) {
                const avg = prices.reduce((a,b)=>a+b,0) / prices.length;
                document.getElementById('avgPrice').textContent = '$' + avg.toFixed(2);
            }
        }

        function renderChart() {
            const dates = priceData.map(d => d.date);
            const prices = priceData.map(d => d.price || 0);

            const cat = document.getElementById('eventCategory').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            const visibleEvents = allEvents.filter(e => (cat === 'all' || e.category === cat) && e.date >= start && e.date <= end);

            const priceTrace = { x: dates, y: prices, mode: 'lines', name: 'Brent Price', line: {color: '#1e40af', width: 3} };

            const eventTraces = visibleEvents.map(ev => {
                const match = priceData.find(p => p.date === ev.date);
                const y = match ? match.price : null;
                if (!y) return null;
                return {
                    x: [ev.date], y: [y],
                    mode: 'markers+text',
                    marker: {size: 14, color: '#ef4444', symbol: 'diamond'},
                    text: [ev.description.substring(0,22)+'...'],
                    hovertext: `<b>${ev.date}</b><br>${ev.description}<br><i>${ev.reason_for_price_change}</i>`,
                    showlegend: false
                };
            }).filter(Boolean);

            Plotly.newPlot('priceChart', [priceTrace, ...eventTraces], {
                title: `Brent Oil Prices (${start} to ${end})`,
                xaxis: {title: 'Date', type: 'date'},
                yaxis: {title: 'Price (USD)'}
            });
        }

        function renderEventsList() {
            const el = document.getElementById('eventsList');
            const cat = document.getElementById('eventCategory').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            const filtered = allEvents.filter(e => (cat === 'all' || e.category === cat) && e.date >= start && e.date <= end);

            el.innerHTML = filtered.map(e => `
                <div class="event-item">
                    <div class="event-date">📅 ${e.date}</div>
                    <div class="event-desc"><strong>${e.description}</strong></div>
                    <div class="event-reason">Reason: ${e.reason_for_price_change}</div>
                    <span class="event-category">${e.category}</span>
                </div>
            `).join('');
        }

        function renderAdvancedAnalysis() {
            const prices = priceData.map(d => d.price || 0).filter(p => p > 0);
            if (!prices.length) return;

            const returns = [];
            for (let i = 1; i < priceData.length; i++) {
                const p1 = priceData[i-1].price || 0;
                const p2 = priceData[i].price || 0;
                if (p1 > 0) returns.push((p2 - p1) / p1);
            }

            const meanRet = returns.reduce((a,b)=>a+b,0) / returns.length;
            const stdRet = Math.sqrt(returns.reduce((a,b)=>a + Math.pow(b-meanRet,2),0) / returns.length);
            const annualizedVol = (stdRet * Math.sqrt(252) * 100).toFixed(2);
            const skew = returns.reduce((a,b)=>a + Math.pow((b-meanRet)/stdRet,3),0) / returns.length;
            const kurt = returns.reduce((a,b)=>a + Math.pow((b-meanRet)/stdRet,4),0) / returns.length;

            // Simple 30-day forecast
            const lastPrice = prices[prices.length-1];
            const trend = (prices[prices.length-1] - prices[0]) / prices.length;
            const forecastPrices = Array.from({length: 30}, (_, i) => lastPrice + trend * (i+1));

            document.getElementById('advancedStats').innerHTML = `
                <div class="stat-row"><span>Annualized Volatility</span><strong>${annualizedVol}%</strong></div>
                <div class="stat-row"><span>Skewness (Returns)</span><strong>${skew.toFixed(3)}</strong></div>
                <div class="stat-row"><span>Kurtosis (Returns)</span><strong>${kurt.toFixed(2)}</strong></div>
                <div class="stat-row"><span>Current Price</span><strong>$${lastPrice.toFixed(2)}</strong></div>
            `;

            // Forecast chart
            const forecastDates = Array.from({length: 30}, (_, i) => {
                const d = new Date();
                d.setDate(d.getDate() + i + 1);
                return d.toISOString().split('T')[0];
            });

            Plotly.newPlot('forecastChart', [
                { x: forecastDates, y: forecastPrices, mode: 'lines', name: '30-Day Forecast', line: {color: '#10b981', width: 3} }
            ], {
                title: '30-Day Price Forecast',
                xaxis: {title: 'Date'},
                yaxis: {title: 'Price (USD)'},
                height: 260,
                margin: {t: 40, b: 40}
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            document.getElementById('startDate').addEventListener('change', loadData);
            document.getElementById('endDate').addEventListener('change', loadData);
            document.getElementById('eventCategory').addEventListener('change', () => {
                renderEventsList();
                renderChart();
            });
        });
    </script>
</body>
</html>
